name: Monitor CIFP Leixa

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: "Enviar solo una notificación de prueba"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: monitor-cifp-leixa
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Validar formato
        run: ruff format --check .

      - name: Ejecutar lint
        run: ruff check .

      - name: Comprobar tipos
        run: mypy src

      - name: Ejecutar tests unitarios
        run: pytest

      - name: Enviar notificación de prueba
        if: ${{ inputs.send_test_notification == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m leixa_monitor.cli send-test-notification

      - name: Comprobar plazas
        if: ${{ inputs.send_test_notification != true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m leixa_monitor.cli check

      - name: Guardar estado actualizado
        if: ${{ inputs.send_test_notification != true && always() }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/state.json data/health.json 2>/dev/null \
             && [ -z "$(git ls-files --others --exclude-standard data/state.json data/health.json)" ]; then
            echo "No hay estado que guardar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/health.json
          git commit -m "chore: update Leixa monitoring state [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "No se pudo publicar el estado tras 3 intentos" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
