[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "leixa-monitor"
version = "1.0.0"
description = "Monitor de plazas liberadas de FP a distancia del CIFP Leixa"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pdfplumber==0.11.7",
  "requests==2.32.4",
]

[project.optional-dependencies]
dev = [
  "mypy==1.16.1",
  "pytest==8.4.1",
  "responses==0.25.7",
  "ruff==0.12.4",
  "types-requests==2.32.4.20250611",
]

[project.scripts]
leixa-monitor = "leixa_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = ["integration: accede al servicio real de la Xunta"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["leixa_monitor"]
mypy_path = "src"

